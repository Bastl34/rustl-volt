[package]
name = "revolt_converter"
version = "0.1.0"
edition = "2024"

# a workspace of its own - not part of the engine workspace
[workspace]

# the conversion as library - the game (code/) runs it at the first start, without the window
[lib]
path = "src/lib.rs"

# the converter window for development: cargo run
[[bin]]
name = "revolt_converter"
path = "src/main.rs"
required-features = ["ui"]

[features]
default = ["ui"]
# preserve_order only here: the game must not change the serde_json features of the engine (another engine build)
ui = ["dep:eframe", "serde_json/preserve_order"]

[dependencies]
# git main like the engine - its .cargo/config.toml patches egui to git for everything below rustl/
eframe = { git = "https://github.com/emilk/egui", branch = "main", optional = true }
image = { version = "0.25", default-features = false, features = ["bmp", "png"] }
# ui: .project and .scene keep their key order when written back
serde_json = "1"
anyhow = "1"
