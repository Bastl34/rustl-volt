  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8d97ad"/></marker>
  <marker id="arrowA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c8cff"/></marker>
  <marker id="arrowX" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ff6b6b"/></marker>
  <marker id="arrowY" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6fd08c"/></marker>
  <marker id="arrowZ" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6c9cff"/></marker>
  <marker id="arrowW" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e8edf7"/></marker>
</defs>
<rect width="1920" height="1080" fill="#0a0e16"/>
<rect width="1920" height="1080" fill="url(#dots)"/>
<rect width="1920" height="1080" fill="url(#glow)"/>
<rect width="1920" height="1080" fill="url(#glow2)"/>
<rect x="96" y="74" width="6" height="92" rx="3" fill="#7c8cff"/>
<text x="126" y="98" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="19" fill="#7c8cff" font-weight="700" letter-spacing="5">REFLECTIONS</text>
<text x="124" y="154" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="52" fill="#e8edf7" font-weight="700">Planar reflection vs SSR</text>
<text x="126" y="196" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="24" fill="#8d97ad">Two ways for rustl · the glb already has the data for both</text>
<rect x="96" y="252" width="844" height="738" rx="18" fill="#111827" stroke="#243049" stroke-width="1.5" filter="url(#shadow)"/><rect x="96" y="252" width="844" height="6" rx="3" fill="#6fd08c"/><text x="128" y="304" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="30" fill="#6fd08c" font-weight="700">Planar reflection</text><text x="908" y="304" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="15" fill="#6fd08c" font-weight="700" text-anchor="end" letter-spacing="3">LATER</text><rect x="136" y="477" width="160" height="8" rx="2" fill="#8d97ad"/><rect x="296" y="477" width="520" height="8" rx="2" fill="#7c8cff" fill-opacity="0.45"/><rect x="816" y="477" width="90" height="8" rx="2" fill="#8d97ad"/><text x="906" y="510" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="15" fill="#8d97ad" text-anchor="end">clip plane = mirror plane</text><rect x="593" y="441.5" width="125.99999999999999" height="28" rx="5.6" fill="#f2b94b" fill-opacity="0.85" stroke="#f2b94b" stroke-width="2"/><path d="M 617.5 441.5 L 631.5 422.6 L 680.5 422.6 L 694.5 441.5 Z" fill="#f2b94b" stroke="#f2b94b" stroke-width="2" fill-opacity="0.595" stroke-linecap="round" stroke-linejoin="round"/><circle cx="614" cy="469.5" r="10.5" fill="#0a0e16" stroke="#f2b94b" stroke-width="2" /><circle cx="698" cy="469.5" r="10.5" fill="#0a0e16" stroke="#f2b94b" stroke-width="2" /><circle cx="206" cy="360" r="14" fill="#e8edf7"/><circle cx="210" cy="360" r="6" fill="#0a0e16"/><text x="206" y="334" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="17" fill="#e8edf7" font-weight="600" text-anchor="middle">camera</text><line x1="206" y1="360" x2="486" y2="480" stroke="#e8edf7" stroke-width="2" stroke-linecap="round"/><circle cx="206" cy="600" r="14" fill="none" stroke="#6fd08c" stroke-width="2" stroke-dasharray="4 4"/><text x="236" y="606" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="17" fill="#6fd08c" font-weight="600">mirrored camera</text><line x1="206" y1="360" x2="206" y2="586" stroke="#4b5672" stroke-width="1.5" stroke-dasharray="3 6" stroke-linecap="round"/><line x1="220" y1="594" x2="616" y2="445" stroke="#6fd08c" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)" stroke-linecap="round"/><rect x="656" y="540" width="70" height="56" rx="6" fill="#6fd08c" fill-opacity="0.18" stroke="#6fd08c" stroke-width="2"/><text x="741" y="563" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="16" fill="#6fd08c">reflection</text><text x="741" y="585" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="16" fill="#6fd08c">texture</text><line x1="676" y1="536" x2="636" y2="490" stroke="#6fd08c" stroke-width="2" marker-end="url(#arrow)" stroke-linecap="round"/><text x="128" y="668" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="15" fill="#8d97ad" font-weight="700" letter-spacing="3">HOW</text><text x="128" y="698" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="19" fill="#e8edf7">mirror the camera, render into a texture, map it</text><text x="128" y="726" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="19" fill="#e8edf7">onto the _mirror polygons (screen space UVs)</text><text x="128" y="760" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="15" fill="#6fd08c" font-weight="700" letter-spacing="3">+  /  −</text><text x="128" y="790" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="19" fill="#e8edf7">exact, also off screen, closest to the original</text><text x="128" y="818" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="19" fill="#e8edf7">one extra scene pass per visible plane</text><text x="128" y="852" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="15" fill="#8d97ad" font-weight="700" letter-spacing="3">DATA</text><text x="128" y="882" style="white-space:pre" font-family="'Cascadia Mono', Consolas, monospace" font-size="19" fill="#e8edf7">mirror_N planes · revolt_mirror_plane</text><text x="128" y="910" style="white-space:pre" font-family="'Cascadia Mono', Consolas, monospace" font-size="19" fill="#e8edf7">mirror_mix</text><rect x="980" y="252" width="844" height="738" rx="18" fill="#111827" stroke="#243049" stroke-width="1.5" filter="url(#shadow)"/><rect x="980" y="252" width="844" height="6" rx="3" fill="#4fd8ff"/><text x="1012" y="304" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="30" fill="#4fd8ff" font-weight="700">Screen space reflection</text><text x="1792" y="304" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="15" fill="#4fd8ff" font-weight="700" text-anchor="end" letter-spacing="3">FIRST</text><rect x="1020" y="477" width="770" height="8" rx="2" fill="#7c8cff" fill-opacity="0.45"/><path d="M 1080 340 L 1790 380 L 1790 480 L 1280 480 Z" fill="#4fd8ff" stroke="#4fd8ff" stroke-width="1" stroke-dasharray="5 6" fill-opacity="0.06" stroke-linecap="round" stroke-linejoin="round"/><text x="1780" y="372" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="15" fill="#4fd8ff" text-anchor="end">on screen</text><rect x="1567" y="441.5" width="125.99999999999999" height="28" rx="5.6" fill="#f2b94b" fill-opacity="0.85" stroke="#f2b94b" stroke-width="2"/><path d="M 1591.5 441.5 L 1605.5 422.6 L 1654.5 422.6 L 1668.5 441.5 Z" fill="#f2b94b" stroke="#f2b94b" stroke-width="2" fill-opacity="0.595" stroke-linecap="round" stroke-linejoin="round"/><circle cx="1588" cy="469.5" r="10.5" fill="#0a0e16" stroke="#f2b94b" stroke-width="2" /><circle cx="1672" cy="469.5" r="10.5" fill="#0a0e16" stroke="#f2b94b" stroke-width="2" /><circle cx="1080" cy="340" r="14" fill="#e8edf7"/><circle cx="1084" cy="340" r="6" fill="#0a0e16"/><text x="1060" y="382" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="17" fill="#e8edf7" font-weight="600" text-anchor="middle">camera</text><line x1="1080" y1="340" x2="1540" y2="480" stroke="#e8edf7" stroke-width="2" stroke-linecap="round"/><circle cx="1555" cy="475.44" r="3" fill="#4fd8ff"/><circle cx="1567" cy="471.792" r="3" fill="#4fd8ff"/><circle cx="1579" cy="468.144" r="3" fill="#4fd8ff"/><text x="1602" y="452" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="22" fill="#6fd08c" font-weight="700">✓</text><line x1="1080" y1="340" x2="1310" y2="480" stroke="#e8edf7" stroke-width="2" stroke-linecap="round"/><circle cx="1325" cy="470.865" r="3" fill="#4fd8ff"/><circle cx="1341" cy="461.121" r="3" fill="#4fd8ff"/><circle cx="1357" cy="451.377" r="3" fill="#4fd8ff"/><circle cx="1373" cy="441.633" r="3" fill="#4fd8ff"/><circle cx="1389" cy="431.889" r="3" fill="#4fd8ff"/><circle cx="1405" cy="422.145" r="3" fill="#4fd8ff"/><circle cx="1421" cy="412.401" r="3" fill="#4fd8ff"/><circle cx="1437" cy="402.657" r="3" fill="#4fd8ff"/><circle cx="1453" cy="392.913" r="3" fill="#4fd8ff"/><circle cx="1469" cy="383.169" r="3" fill="#4fd8ff"/><circle cx="1485" cy="373.425" r="3" fill="#4fd8ff"/><circle cx="1501" cy="363.681" r="3" fill="#4fd8ff"/><circle cx="1517" cy="353.937" r="3" fill="#4fd8ff"/><text x="1532" y="340" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="22" fill="#ff6b8b" font-weight="700">✗</text><text x="1556" y="338" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="16" fill="#ff6b8b">leaves the screen</text><text x="1556" y="360" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="16" fill="#ff6b8b">nothing to sample</text><text x="1220" y="560" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="16" fill="#4fd8ff">march the reflected ray through the depth buffer</text><text x="1012" y="668" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="15" fill="#8d97ad" font-weight="700" letter-spacing="3">HOW</text><text x="1012" y="698" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="19" fill="#e8edf7">one fullscreen pass after the scene: follow the</text><text x="1012" y="726" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="19" fill="#e8edf7">reflected ray on screen, take the color it hits</text><text x="1012" y="760" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="15" fill="#4fd8ff" font-weight="700" letter-spacing="3">+  /  −</text><text x="1012" y="790" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="19" fill="#e8edf7">cheap, any surface, no extra scene pass</text><text x="1012" y="818" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="19" fill="#e8edf7">only what is on screen: gaps at edges, under cars</text><text x="1012" y="852" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="15" fill="#8d97ad" font-weight="700" letter-spacing="3">DATA</text><text x="1012" y="882" style="white-space:pre" font-family="'Cascadia Mono', Consolas, monospace" font-size="19" fill="#e8edf7">revolt_mirror (where) · mirror_mix (how strong)</text><text x="1012" y="910" style="white-space:pre" font-family="'Cascadia Mono', Consolas, monospace" font-size="19" fill="#e8edf7"></text>
<text x="96" y="1040" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="16" fill="#4b5672" font-weight="700" letter-spacing="4">RE-VOLT  →  RUSTL</text>
<text x="1824" y="1040" style="white-space:pre" font-family="'Cascadia Mono', Consolas, monospace" font-size="16" fill="#4b5672" font-weight="700" text-anchor="end" letter-spacing="3">15 / 21</text>
</svg>