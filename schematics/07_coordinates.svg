<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<defs>
  <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.6" fill="#182033"/></pattern>
  <radialGradient id="glow" cx="85%" cy="-10%" r="75%"><stop offset="0" stop-color="#22305a" stop-opacity="0.85"/><stop offset="1" stop-color="#0a0e16" stop-opacity="0"/></radialGradient>
  <radialGradient id="glow2" cx="0%" cy="110%" r="60%"><stop offset="0" stop-color="#1c3a3a" stop-opacity="0.6"/><stop offset="1" stop-color="#0a0e16" stop-opacity="0"/></radialGradient>
  <linearGradient id="rgb" x1="0" x2="1"><stop offset="0" stop-color="#ff6b8b"/><stop offset="0.35" stop-color="#f2b94b"/><stop offset="0.65" stop-color="#6fd08c"/><stop offset="1" stop-color="#6c7cff"/></linearGradient>
  <pattern id="checker" width="20" height="20" patternUnits="userSpaceOnUse"><rect width="20" height="20" fill="#2a3246"/><rect width="10" height="10" fill="#3a4460"/><rect x="10" y="10" width="10" height="10" fill="#3a4460"/></pattern>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="135%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.5"/></filter>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8d97ad"/></marker>
  <marker id="arrowA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c8cff"/></marker>
  <marker id="arrowX" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ff6b6b"/></marker>
  <marker id="arrowY" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6fd08c"/></marker>
  <marker id="arrowZ" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6c9cff"/></marker>
  <marker id="arrowW" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e8edf7"/></marker>
</defs>
<rect width="1920" height="1080" fill="#0a0e16"/>
<rect width="1920" height="1080" fill="url(#dots)"/>
<rect width="1920" height="1080" fill="url(#glow)"/>
<rect width="1920" height="1080" fill="url(#glow2)"/>
<rect x="96" y="74" width="6" height="92" rx="3" fill="#7c8cff"/>
<text x="126" y="98" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="19" fill="#7c8cff" font-weight="700" letter-spacing="5">RE-VOLT FILE FORMATS</text>
<text x="124" y="154" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="52" fill="#e8edf7" font-weight="700">Coordinates, winding, scale</text>
<text x="126" y="196" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="24" fill="#8d97ad">Three small things that break everything when they are wrong</text>
<rect x="96" y="252" width="540" height="420" rx="18" fill="#111827" stroke="#243049" stroke-width="1.5" filter="url(#shadow)"/><text x="128" y="304" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="32" fill="#e8edf7" font-weight="700">Re-Volt</text><text x="128" y="340" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="20" fill="#8d97ad">Y down · Z into the screen</text><line x1="300" y1="470" x2="450" y2="470" stroke="#ff6b6b" stroke-width="5" marker-end="url(#arrowX)" stroke-linecap="round"/><text x="468" y="479" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="28" fill="#ff6b6b" font-weight="700">X</text><line x1="300" y1="470" x2="300" y2="620" stroke="#6fd08c" stroke-width="5" marker-end="url(#arrowY)" stroke-linecap="round"/><text x="286" y="660" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="28" fill="#6fd08c" font-weight="700" text-anchor="middle">Y</text><line x1="300" y1="470" x2="390" y2="398" stroke="#6c9cff" stroke-width="5" stroke-dasharray="10 8" marker-end="url(#arrowZ)" stroke-linecap="round"/><text x="412" y="392" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="28" fill="#6c9cff" font-weight="700">Z</text><circle cx="300" cy="470" r="8" fill="#e8edf7"/><rect x="1284" y="252" width="540" height="420" rx="18" fill="#111827" stroke="#243049" stroke-width="1.5" filter="url(#shadow)"/><text x="1316" y="304" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="32" fill="#e8edf7" font-weight="700">glTF / rustl</text><text x="1316" y="340" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="20" fill="#8d97ad">Y up · Z toward the viewer</text><line x1="1500" y1="540" x2="1650" y2="540" stroke="#ff6b6b" stroke-width="5" marker-end="url(#arrowX)" stroke-linecap="round"/><text x="1668" y="549" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="28" fill="#ff6b6b" font-weight="700">X</text><line x1="1500" y1="540" x2="1500" y2="390" stroke="#6fd08c" stroke-width="5" marker-end="url(#arrowY)" stroke-linecap="round"/><text x="1486" y="374" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="28" fill="#6fd08c" font-weight="700" text-anchor="middle">Y</text><line x1="1500" y1="540" x2="1400" y2="620" stroke="#6c9cff" stroke-width="5" marker-end="url(#arrowZ)" stroke-linecap="round"/><text x="1374" y="648" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="28" fill="#6c9cff" font-weight="700">Z</text><circle cx="1500" cy="540" r="8" fill="#e8edf7"/><line x1="680" y1="440" x2="1240" y2="440" stroke="#7c8cff" stroke-width="3" marker-end="url(#arrowA)" stroke-linecap="round"/><text x="960" y="400" style="white-space:pre" font-family="'Cascadia Mono', Consolas, monospace" font-size="32" fill="#e8edf7" font-weight="700" text-anchor="middle">(x, y, z)  →  (x, −y, −z) × 0.01</text><text x="960" y="496" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="22" fill="#8d97ad" text-anchor="middle">180° turn around X · no mirroring</text><text x="960" y="532" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="22" fill="#8d97ad" text-anchor="middle">units → meters</text><rect x="96" y="710" width="1100" height="280" rx="18" fill="#111827" stroke="#243049" stroke-width="1.5" filter="url(#shadow)"/><text x="128" y="760" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="28" fill="#e8edf7" font-weight="700">Winding</text><text x="128" y="794" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="19" fill="#8d97ad">front faces: clockwise in Re-Volt (Direct3D), counter-clockwise in glTF</text><path d="M 170 814 L 320 814 L 320 944 L 170 944 Z" fill="#ff8f4d" stroke="#ff8f4d" stroke-width="2" fill-opacity="0.12" stroke-linecap="round" stroke-linejoin="round"/><circle cx="170" cy="814" r="14" fill="#ff8f4d"/><text x="170" y="820" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="16" fill="#0a0e16" font-weight="700" text-anchor="middle">0</text><circle cx="320" cy="814" r="14" fill="#ff8f4d"/><text x="320" y="820" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="16" fill="#0a0e16" font-weight="700" text-anchor="middle">1</text><circle cx="320" cy="944" r="14" fill="#ff8f4d"/><text x="320" y="950" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="16" fill="#0a0e16" font-weight="700" text-anchor="middle">2</text><circle cx="170" cy="944" r="14" fill="#ff8f4d"/><text x="170" y="950" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="16" fill="#0a0e16" font-weight="700" text-anchor="middle">3</text><text x="245" y="978" style="white-space:pre" font-family="'Cascadia Mono', Consolas, monospace" font-size="18" fill="#8d97ad" text-anchor="middle">0 → 1 → 2 → 3</text><path d="M 214 854 A 40 40 0 1 1 214 904" fill="none" stroke="#e8edf7" stroke-width="2.5" marker-end="url(#arrowW)" stroke-linecap="round" stroke-linejoin="round"/><line x1="400" y1="879" x2="520" y2="879" stroke="#7c8cff" stroke-width="3" marker-end="url(#arrowA)" stroke-linecap="round"/><path d="M 580 814 L 730 944 L 730 814 Z" fill="#4fd8ff" stroke="#4fd8ff" stroke-width="2" fill-opacity="0.14" stroke-linecap="round" stroke-linejoin="round"/><path d="M 580 814 L 580 944 L 730 944 Z" fill="#6fd08c" stroke="#6fd08c" stroke-width="2" fill-opacity="0.14" stroke-linecap="round" stroke-linejoin="round"/><circle cx="580" cy="814" r="14" fill="#e8edf7"/><text x="580" y="820" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="16" fill="#0a0e16" font-weight="700" text-anchor="middle">0</text><circle cx="730" cy="814" r="14" fill="#e8edf7"/><text x="730" y="820" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="16" fill="#0a0e16" font-weight="700" text-anchor="middle">1</text><circle cx="730" cy="944" r="14" fill="#e8edf7"/><text x="730" y="950" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="16" fill="#0a0e16" font-weight="700" text-anchor="middle">2</text><circle cx="580" cy="944" r="14" fill="#e8edf7"/><text x="580" y="950" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="16" fill="#0a0e16" font-weight="700" text-anchor="middle">3</text><text x="820" y="862" style="white-space:pre" font-family="'Cascadia Mono', Consolas, monospace" font-size="24" fill="#4fd8ff" font-weight="700">(0, 2, 1)</text><text x="820" y="906" style="white-space:pre" font-family="'Cascadia Mono', Consolas, monospace" font-size="24" fill="#6fd08c" font-weight="700">(0, 3, 2)</text><text x="820" y="950" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="18" fill="#8d97ad">swap the last two</text><rect x="1228" y="710" width="596" height="280" rx="18" fill="#111827" stroke="#243049" stroke-width="1.5" filter="url(#shadow)"/><text x="1260" y="760" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="28" fill="#e8edf7" font-weight="700">Scale</text><text x="1260" y="794" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="19" fill="#8d97ad">1 unit ≈ 1 cm · rustl works in meters</text><text x="1260" y="850" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="21" fill="#e8edf7">RC car wheel radius</text><text x="1638" y="850" style="white-space:pre" font-family="'Cascadia Mono', Consolas, monospace" font-size="21" fill="#8d97ad" text-anchor="end">10</text><text x="1658" y="850" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="21" fill="#4b5672">→</text><text x="1792" y="850" style="white-space:pre" font-family="'Cascadia Mono', Consolas, monospace" font-size="21" fill="#6fd08c" font-weight="700" text-anchor="end">0.10 m</text><text x="1260" y="896" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="21" fill="#e8edf7">RC car wheelbase</text><text x="1638" y="896" style="white-space:pre" font-family="'Cascadia Mono', Consolas, monospace" font-size="21" fill="#8d97ad" text-anchor="end">84</text><text x="1658" y="896" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="21" fill="#4b5672">→</text><text x="1792" y="896" style="white-space:pre" font-family="'Cascadia Mono', Consolas, monospace" font-size="21" fill="#6fd08c" font-weight="700" text-anchor="end">0.84 m</text><text x="1260" y="942" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="21" fill="#e8edf7">Supermarket</text><text x="1638" y="942" style="white-space:pre" font-family="'Cascadia Mono', Consolas, monospace" font-size="21" fill="#8d97ad" text-anchor="end">20500</text><text x="1658" y="942" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="21" fill="#4b5672">→</text><text x="1792" y="942" style="white-space:pre" font-family="'Cascadia Mono', Consolas, monospace" font-size="21" fill="#6fd08c" font-weight="700" text-anchor="end">205 m</text>
<text x="96" y="1040" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="16" fill="#4b5672" font-weight="700" letter-spacing="4">RE-VOLT  →  RUSTL</text>
<text x="1824" y="1040" style="white-space:pre" font-family="'Cascadia Mono', Consolas, monospace" font-size="16" fill="#4b5672" font-weight="700" text-anchor="end" letter-spacing="3">07 / 21</text>
