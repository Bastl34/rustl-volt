<rect x="96" y="262" width="760" height="50" rx="12" fill="#6c7cff" fill-opacity="0.18" stroke="#6c7cff" stroke-width="2"/><text x="124" y="296" style="white-space:pre" font-family="'Cascadia Mono', Consolas, monospace" font-size="23" fill="#6c7cff" font-weight="600">i32 mesh_count</text><text x="828" y="295" style="white-space:pre" font-family="'Cascadia Mono', Consolas, monospace" font-size="21" fill="#8d97ad" text-anchor="end">= 1452</text><rect x="96" y="322" width="760" height="270" rx="12" fill="#6fd08c" fill-opacity="0.12" stroke="#6fd08c" stroke-width="2"/><text x="124" y="374" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="30" fill="#6fd08c" font-weight="700">Mesh × 1452</text><rect x="124" y="414" width="704" height="34" rx="8" fill="#3fc9c0" fill-opacity="0.14" stroke="#3fc9c0" stroke-width="1.2"/><text x="142" y="438" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="19" fill="#3fc9c0" font-weight="600">bounds</text><text x="810" y="438" style="white-space:pre" font-family="'Cascadia Mono', Consolas, monospace" font-size="17" fill="#8d97ad" text-anchor="end">40 B</text><rect x="124" y="456" width="704" height="34" rx="8" fill="#f2b94b" fill-opacity="0.14" stroke="#f2b94b" stroke-width="1.2"/><text x="142" y="480" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="19" fill="#f2b94b" font-weight="600">counts</text><text x="810" y="480" style="white-space:pre" font-family="'Cascadia Mono', Consolas, monospace" font-size="17" fill="#8d97ad" text-anchor="end">4 B</text><rect x="124" y="498" width="704" height="34" rx="8" fill="#ff6b8b" fill-opacity="0.14" stroke="#ff6b8b" stroke-width="1.2"/><text x="142" y="522" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="19" fill="#ff6b8b" font-weight="600">polygons</text><text x="810" y="522" style="white-space:pre" font-family="'Cascadia Mono', Consolas, monospace" font-size="17" fill="#8d97ad" text-anchor="end">60 B each</text><rect x="124" y="540" width="704" height="34" rx="8" fill="#3fa86a" fill-opacity="0.14" stroke="#3fa86a" stroke-width="1.2"/><text x="142" y="564" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="19" fill="#3fa86a" font-weight="600">vertices</text><text x="810" y="564" style="white-space:pre" font-family="'Cascadia Mono', Consolas, monospace" font-size="17" fill="#8d97ad" text-anchor="end">24 B each</text><rect x="96" y="602" width="760" height="50" rx="12" fill="#6c7cff" fill-opacity="0.18" stroke="#6c7cff" stroke-width="2"/><text x="124" y="636" style="white-space:pre" font-family="'Cascadia Mono', Consolas, monospace" font-size="23" fill="#6c7cff" font-weight="600">i32 big_cube_count</text><text x="828" y="635" style="white-space:pre" font-family="'Cascadia Mono', Consolas, monospace" font-size="21" fill="#8d97ad" text-anchor="end">= 57</text><rect x="96" y="662" width="760" height="78" rx="12" fill="#3fc9c0" fill-opacity="0.12" stroke="#3fc9c0" stroke-width="2"/><text x="124" y="710" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="30" fill="#3fc9c0" font-weight="700">BigCube × 57</text><text x="828" y="709" style="white-space:pre" font-family="'Cascadia Mono', Consolas, monospace" font-size="21" fill="#8d97ad" text-anchor="end">center, radius, mesh ids</text><rect x="96" y="750" width="760" height="50" rx="12" fill="#6c7cff" fill-opacity="0.18" stroke="#6c7cff" stroke-width="2"/><text x="124" y="784" style="white-space:pre" font-family="'Cascadia Mono', Consolas, monospace" font-size="23" fill="#6c7cff" font-weight="600">i32 tex_anim_count</text><text x="828" y="783" style="white-space:pre" font-family="'Cascadia Mono', Consolas, monospace" font-size="21" fill="#8d97ad" text-anchor="end">= 1</text><rect x="96" y="810" width="760" height="64" rx="12" fill="#b38cff" fill-opacity="0.12" stroke="#b38cff" stroke-width="2"/><text x="124" y="851" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="30" fill="#b38cff" font-weight="700">TexAnim × 1</text><text x="828" y="850" style="white-space:pre" font-family="'Cascadia Mono', Consolas, monospace" font-size="21" fill="#8d97ad" text-anchor="end">31 frames</text><rect x="96" y="884" width="760" height="64" rx="12" fill="#f2b94b" fill-opacity="0.18" stroke="#f2b94b" stroke-width="2" stroke-dasharray="8 6"/><text x="124" y="925" style="white-space:pre" font-family="'Cascadia Mono', Consolas, monospace" font-size="23" fill="#f2b94b" font-weight="600">u32 env_colors × 1837</text><text x="828" y="924" style="white-space:pre" font-family="'Cascadia Mono', Consolas, monospace" font-size="21" fill="#8d97ad" text-anchor="end">no count stored!</text><rect x="940" y="262" width="884" height="330" rx="18" fill="#111827" stroke="#243049" stroke-width="1.5" filter="url(#shadow)"/><text x="976" y="318" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="28" fill="#e8edf7" font-weight="700">Where the bytes go</text><text x="976" y="352" style="white-space:pre" font-family="'Cascadia Mono', Consolas, monospace" font-size="20" fill="#8d97ad">market1.w · 1,174,104 bytes</text><rect x="976" y="382" width="799.2443735818973" height="46" rx="6" fill="#6fd08c" fill-opacity="0.8"/><rect x="1777.2443735818974" y="382" width="4" height="46" rx="6" fill="#3fc9c0" fill-opacity="0.8"/><rect x="1783.2443735818974" y="382" width="4" height="46" rx="6" fill="#b38cff" fill-opacity="0.8"/><rect x="1789.2443735818974" y="382" width="4" height="46" rx="6" fill="#f2b94b" fill-opacity="0.8"/><rect x="976" y="467" width="18" height="18" rx="4" fill="#6fd08c"/><text x="1006" y="482" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="22" fill="#e8edf7" font-weight="600">Meshes</text><text x="1356" y="482" style="white-space:pre" font-family="'Cascadia Mono', Consolas, monospace" font-size="20" fill="#8d97ad" text-anchor="end">98.7 %</text><rect x="1396" y="467" width="18" height="18" rx="4" fill="#3fc9c0"/><text x="1426" y="482" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="22" fill="#e8edf7" font-weight="600">Big cubes</text><text x="1776" y="482" style="white-space:pre" font-family="'Cascadia Mono', Consolas, monospace" font-size="20" fill="#8d97ad" text-anchor="end">0.6 %</text><rect x="976" y="517" width="18" height="18" rx="4" fill="#b38cff"/><text x="1006" y="532" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="22" fill="#e8edf7" font-weight="600">Texture anim</text><text x="1356" y="532" style="white-space:pre" font-family="'Cascadia Mono', Consolas, monospace" font-size="20" fill="#8d97ad" text-anchor="end">0.1 %</text><rect x="1396" y="517" width="18" height="18" rx="4" fill="#f2b94b"/><text x="1426" y="532" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="22" fill="#e8edf7" font-weight="600">Env colors</text><text x="1776" y="532" style="white-space:pre" font-family="'Cascadia Mono', Consolas, monospace" font-size="20" fill="#8d97ad" text-anchor="end">0.6 %</text><rect x="940" y="640" width="884" height="70" rx="18" fill="#111827" stroke="#243049" stroke-width="1.5" filter="url(#shadow)"/><rect x="940" y="640" width="6" height="70" rx="3" fill="#6fd08c"/><text x="972" y="684" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="23" fill="#6fd08c" font-weight="700">Mesh</text><text x="1150" y="684" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="22" fill="#e8edf7">a chunk of the track with its own bounding sphere</text><rect x="940" y="726" width="884" height="70" rx="18" fill="#111827" stroke="#243049" stroke-width="1.5" filter="url(#shadow)"/><rect x="940" y="726" width="6" height="70" rx="3" fill="#3fc9c0"/><text x="972" y="770" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="23" fill="#3fc9c0" font-weight="700">BigCube</text><text x="1150" y="770" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="22" fill="#e8edf7">groups meshes for culling → one glTF node each</text><rect x="940" y="812" width="884" height="70" rx="18" fill="#111827" stroke="#243049" stroke-width="1.5" filter="url(#shadow)"/><rect x="940" y="812" width="6" height="70" rx="3" fill="#b38cff"/><text x="972" y="856" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="23" fill="#b38cff" font-weight="700">TexAnim</text><text x="1150" y="856" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="22" fill="#e8edf7">frames of (texture page, delay, 4 UVs)</text><rect x="940" y="898" width="884" height="70" rx="18" fill="#111827" stroke="#243049" stroke-width="1.5" filter="url(#shadow)"/><rect x="940" y="898" width="6" height="70" rx="3" fill="#f2b94b"/><text x="972" y="942" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="23" fill="#f2b94b" font-weight="700">Env colors</text><text x="1150" y="942" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="22" fill="#e8edf7">count = polygons with the ENV flag (2048)</text>
