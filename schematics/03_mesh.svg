e box is min/max per axis:</text><text x="1332" y="726" style="white-space:pre" font-family="'Cascadia Mono', Consolas, monospace" font-size="21" fill="#38b2d8">xlo xhi ylo yhi zlo zhi</text><text x="1332" y="768" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="21" fill="#e8edf7">.prm / .m files (cars, props) use the</text><text x="1332" y="798" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="21" fill="#e8edf7">same body, without the 40-byte bounds.</text><rect x="96" y="860" width="1728" height="120" rx="18" fill="#111827" stroke="#243049" stroke-width="1.5" filter="url(#shadow)"/><text x="128" y="908" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="22" fill="#7c8cff" font-weight="700">market1 · mesh 0</text><text x="128" y="950" font-family="'Segoe UI', Arial, sans-serif" font-size="23" fill="#e8edf7"><tspan fill="#8d97ad">center </tspan><tspan fill="#6fd08c" font-weight="600" font-family="'Cascadia Mono', Consolas, monospace">(−3125, −1375, −1000)</tspan><tspan fill="#8d97ad">   radius </tspan><tspan fill="#3fc9c0" font-weight="600" font-family="'Cascadia Mono', Consolas, monospace">395</tspan><tspan fill="#8d97ad">   polygons </tspan><tspan fill="#f2b94b" font-weight="600" font-family="'Cascadia Mono', Consolas, monospace">3</tspan><tspan fill="#8d97ad">   vertices </tspan><tspan fill="#f2b94b" font-weight="600" font-family="'Cascadia Mono', Consolas, monospace">8</tspan><tspan fill="#8d97ad">   →  44 + 3 × 60 + 8 × 24 = </tspan><tspan fill="#e8edf7" font-weight="700" font-family="'Cascadia Mono', Consolas, monospace">416 bytes</tspan></text>
