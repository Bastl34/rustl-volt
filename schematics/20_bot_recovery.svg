<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<defs>
  <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.6" fill="#182033"/></pattern>
  <radialGradient id="glow" cx="85%" cy="-10%" r="75%"><stop offset="0" stop-color="#22305a" stop-opacity="0.85"/><stop offset="1" stop-color="#0a0e16" stop-opacity="0"/></radialGradient>
  <radialGradient id="glow2" cx="0%" cy="110%" r="60%"><stop offset="0" stop-color="#1c3a3a" stop-opacity="0.6"/><stop offset="1" stop-color="#0a0e16" stop-opacity="0"/></radialGradient>
  <linearGradient id="rgb" x1="0" x2="1"><stop offset="0" stop-color="#ff6b8b"/><stop offset="0.35" stop-color="#f2b94b"/><stop offset="0.65" stop-color="#6fd08c"/><stop offset="1" stop-color="#6c7cff"/></linearGradient>
  <pattern id="checker" width="20" height="20" patternUnits="userSpaceOnUse"><rect width="20" height="20" fill="#2a3246"/><rect width="10" height="10" fill="#3a4460"/><rect x="10" y="10" width="10" height="10" fill="#3a4460"/></pattern>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="135%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.5"/></filter>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8d97ad"/></marker>
  <marker id="arrowA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c8cff"/></marker>
  <marker id="arrowX" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ff6b6b"/></marker>
  <marker id="arrowY" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6fd08c"/></marker>
  <marker id="arrowZ" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6c9cff"/></marker>
  <marker id="arrowW" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e8edf7"/></marker>
</defs>
<rect width="1920" height="1080" fill="#0a0e16"/>
<rect width="1920" height="1080" fill="url(#dots)"/>
<rect width="1920" height="1080" fill="url(#glow)"/>
<rect width="1920" height="1080" fill="url(#glow2)"/>
<rect x="96" y="74" width="6" height="92" rx="3" fill="#7c8cff"/>
<text x="126" y="98" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="19" fill="#7c8cff" font-weight="700" letter-spacing="5">BOTS</text>
<text x="124" y="154" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="52" fill="#e8edf7" font-weight="700">When something goes wrong</text>
<text x="126" y="196" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="24" fill="#8d97ad">Three checks, from free yourself to put back further ahead</text>
<rect x="96" y="252" width="540" height="520" rx="18" fill="#111827" stroke="#243049" stroke-width="1.5" filter="url(#shadow)"/><circle cx="152" cy="314" r="30" fill="#f2b94b" fill-opacity="0.18" stroke="#f2b94b" stroke-width="2"/><text x="152" y="324.8" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="30" fill="#f2b94b" font-weight="700" text-anchor="middle">1</text><text x="200" y="324.8" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="30" fill="#f2b94b" font-weight="700">Stuck</text><rect x="486" y="296" width="118" height="36" rx="18" fill="#f2b94b" fill-opacity="0.16" stroke="#f2b94b" stroke-width="1.5"/><text x="545" y="321" style="white-space:pre" font-family="'Cascadia Mono', Consolas, monospace" font-size="20" fill="#f2b94b" font-weight="600" text-anchor="middle">1.2 s</text><line x1="124" y1="370" x2="608" y2="370" stroke="#243049" stroke-width="1.5" stroke-linecap="round"/><text x="128" y="414" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="15" fill="#4b5672" font-weight="700" letter-spacing="3">WHEN</text><text x="128" y="450" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="21" fill="#e8edf7">throttle on, but slower</text><text x="128" y="482" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="21" fill="#e8edf7">than 0.6 m/s</text><text x="128" y="602" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="15" fill="#f2b94b" font-weight="700" letter-spacing="3">THEN</text><text x="128" y="638" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="21" fill="#f2b94b">reverse for 1 s,</text><text x="128" y="670" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="21" fill="#f2b94b">steering the other way</text><line x1="644" y1="512" x2="680" y2="512" stroke="#7c8cff" stroke-width="3" marker-end="url(#arrowA)" stroke-linecap="round"/><rect x="690" y="252" width="540" height="520" rx="18" fill="#111827" stroke="#243049" stroke-width="1.5" filter="url(#shadow)"/><circle cx="746" cy="314" r="30" fill="#ff6b8b" fill-opacity="0.18" stroke="#ff6b8b" stroke-width="2"/><text x="746" y="324.8" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="30" fill="#ff6b8b" font-weight="700" text-anchor="middle">2</text><text x="794" y="324.8" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="30" fill="#ff6b8b" font-weight="700">Lost</text><rect x="1080" y="296" width="118" height="36" rx="18" fill="#ff6b8b" fill-opacity="0.16" stroke="#ff6b8b" stroke-width="1.5"/><text x="1139" y="321" style="white-space:pre" font-family="'Cascadia Mono', Consolas, monospace" font-size="20" fill="#ff6b8b" font-weight="600" text-anchor="middle">2 s</text><line x1="718" y1="370" x2="1202" y2="370" stroke="#243049" stroke-width="1.5" stroke-linecap="round"/><text x="722" y="414" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="15" fill="#4b5672" font-weight="700" letter-spacing="3">WHEN</text><text x="722" y="450" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="21" fill="#e8edf7">upside down · 3 m beyond</text><text x="722" y="482" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="21" fill="#e8edf7">the edge · out of every</text><text x="722" y="514" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="21" fill="#e8edf7">zone (.taz) · or 3 reverses</text><text x="722" y="546" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="21" fill="#e8edf7">in a row</text><text x="722" y="602" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="15" fill="#ff6b8b" font-weight="700" letter-spacing="3">THEN</text><text x="722" y="638" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="21" fill="#ff6b8b">onto the racing line</text><text x="722" y="670" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="21" fill="#ff6b8b">of the next node,</text><text x="722" y="702" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="21" fill="#ff6b8b">upright, standing</text><line x1="1238" y1="512" x2="1274" y2="512" stroke="#7c8cff" stroke-width="3" marker-end="url(#arrowA)" stroke-linecap="round"/><rect x="1284" y="252" width="540" height="520" rx="18" fill="#111827" stroke="#243049" stroke-width="1.5" filter="url(#shadow)"/><circle cx="1340" cy="314" r="30" fill="#b38cff" fill-opacity="0.18" stroke="#b38cff" stroke-width="2"/><text x="1340" y="324.8" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="30" fill="#b38cff" font-weight="700" text-anchor="middle">3</text><text x="1388" y="324.8" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="30" fill="#b38cff" font-weight="700">No progress</text><rect x="1674" y="296" width="118" height="36" rx="18" fill="#b38cff" fill-opacity="0.16" stroke="#b38cff" stroke-width="1.5"/><text x="1733" y="321" style="white-space:pre" font-family="'Cascadia Mono', Consolas, monospace" font-size="20" fill="#b38cff" font-weight="600" text-anchor="middle">7 s</text><line x1="1312" y1="370" x2="1796" y2="370" stroke="#243049" stroke-width="1.5" stroke-linecap="round"/><text x="1316" y="414" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="15" fill="#4b5672" font-weight="700" letter-spacing="3">WHEN</text><text x="1316" y="450" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="21" fill="#e8edf7">less than 4 m along the</text><text x="1316" y="482" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="21" fill="#e8edf7">track (race score), e.g.</text><text x="1316" y="514" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="21" fill="#e8edf7">stuck in the garden1 water</text><text x="1316" y="602" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="15" fill="#b38cff" font-weight="700" letter-spacing="3">THEN</text><text x="1316" y="638" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="21" fill="#b38cff">1, 2, 3 … nodes further</text><text x="1316" y="670" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="21" fill="#b38cff">ahead each time · the count</text><text x="1316" y="702" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="21" fill="#b38cff">clears after 50 m</text><rect x="96" y="800" width="1728" height="190" rx="18" fill="#111827" stroke="#243049" stroke-width="1.5" filter="url(#shadow)"/><text x="128" y="848" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="15" fill="#4b5672" font-weight="700" letter-spacing="3">PUT BACK</text><text x="128" y="892" style="white-space:pre" font-family="'Cascadia Mono', Consolas, monospace" font-size="21" fill="#f2b94b">VehicleController::place(scene, position, heading)</text><text x="128" y="926" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="19" fill="#e8edf7">upright, at a standstill, out of walls first · 0.3 m above the racing line · facing to the node after</text><text x="128" y="960" style="white-space:pre" font-family="'Cascadia Mono', Consolas, monospace" font-size="18" fill="#8d97ad">log: race: Phat Slug put back onto the track (upside down)</text><text x="1792" y="892" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="18" fill="#8d97ad" text-anchor="end">garden1 · 7 bots · 90 s</text><text x="1792" y="926" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="21" fill="#6fd08c" font-weight="600" text-anchor="end">about one reset per bot per 80 s</text>
<text x="96" y="1040" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="16" fill="#4b5672" font-weight="700" letter-spacing="4">RE-VOLT  →  RUSTL</text>
<text x="1824" y="1040" style="white-space:pre" font-family="'Cascadia Mono', Consolas, monospace" font-size="16" fill="#4b5672" font-weight="700" text-anchor="end" letter-spacing="3">20 / 21</text>
</svg>