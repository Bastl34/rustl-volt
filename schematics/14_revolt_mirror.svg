<text x="126" y="98" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="19" fill="#7c8cff" font-weight="700" letter-spacing="5">REFLECTIONS</text>
<text x="124" y="154" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="52" fill="#e8edf7" font-weight="700">How Re-Volt mirrors</text>
<text x="126" y="196" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="24" fill="#8d97ad">A second, flipped copy of the scene under a see-through floor</text>
<rect x="96" y="252" width="1060" height="738" rx="18" fill="#111827" stroke="#243049" stroke-width="1.5" filter="url(#shadow)"/><text x="128" y="300" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="15" fill="#4b5672" font-weight="700" letter-spacing="3">SIDE VIEW</text><defs><linearGradient id="fade" gradientUnits="userSpaceOnUse" x1="0" y1="640" x2="0" y2="880"><stop offset="0" stop-color="#38b2d8" stop-opacity="0.45"/><stop offset="0.62" stop-color="#38b2d8" stop-opacity="0.45"/><stop offset="1" stop-color="#38b2d8" stop-opacity="0"/></linearGradient></defs><rect x="820" y="640" width="80" height="240" rx="2" fill="url(#fade)"/><rect x="590" y="655" width="180" height="40" rx="8" fill="#f2b94b" fill-opacity="0.3" stroke="#f2b94b" stroke-width="2" stroke-dasharray="6 5"/><path d="M 625 695 L 645 722 L 715 722 L 735 695 Z" fill="#f2b94b" stroke="#f2b94b" stroke-width="2" stroke-dasharray="6 5" fill-opacity="0.21" stroke-linecap="round" stroke-linejoin="round"/><circle cx="620" cy="655" r="15" fill="#0a0e16" stroke="#f2b94b" stroke-width="2" stroke-dasharray="6 5"/><circle cx="740" cy="655" r="15" fill="#0a0e16" stroke="#f2b94b" stroke-width="2" stroke-dasharray="6 5"/><text x="680" y="770" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="18" fill="#8d97ad" text-anchor="middle">mirrored copy · drawn first</text><rect x="820" y="400" width="80" height="240" rx="2" fill="#38b2d8" fill-opacity="0.75"/><line x1="820" y1="580" x2="900" y2="580" stroke="#0a0e16" stroke-width="3" stroke-linecap="round"/><line x1="820" y1="520" x2="900" y2="520" stroke="#0a0e16" stroke-width="3" stroke-linecap="round"/><line x1="820" y1="460" x2="900" y2="460" stroke="#0a0e16" stroke-width="3" stroke-linecap="round"/><text x="860" y="386" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="17" fill="#38b2d8" text-anchor="middle">shelf</text><rect x="590" y="585" width="180" height="40" rx="8" fill="#f2b94b" fill-opacity="0.85" stroke="#f2b94b" stroke-width="2"/><path d="M 625 585 L 645 558 L 715 558 L 735 585 Z" fill="#f2b94b" stroke="#f2b94b" stroke-width="2" fill-opacity="0.595" stroke-linecap="round" stroke-linejoin="round"/><circle cx="620" cy="625" r="15" fill="#0a0e16" stroke="#f2b94b" stroke-width="2" /><circle cx="740" cy="625" r="15" fill="#0a0e16" stroke="#f2b94b" stroke-width="2" /><text x="680" y="540" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="17" fill="#f2b94b" text-anchor="middle">car</text><line x1="300" y1="490" x2="960" y2="490" stroke="#4b5672" stroke-width="1.5" stroke-dasharray="6 6" stroke-linecap="round"/><text x="440" y="480" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="16" fill="#8d97ad">mirror distance · 5.12 m · above it fades out</text><rect x="130" y="637" width="170" height="10" rx="2" fill="#8d97ad"/><rect x="960" y="637" width="160" height="10" rx="2" fill="#8d97ad"/><rect x="300" y="637" width="660" height="10" rx="2" fill="#7c8cff" fill-opacity="0.45"/><text x="312" y="674" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="17" fill="#7c8cff" font-weight="600">MIRROR polygons</text><text x="312" y="698" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="16" fill="#7c8cff">drawn on top at 60 % (mix)</text><text x="1040" y="674" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="17" fill="#8d97ad" font-weight="600" text-anchor="middle">opaque floor</text><text x="1040" y="698" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="16" fill="#8d97ad" text-anchor="middle">hides the copy</text><text x="215" y="674" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="17" fill="#8d97ad" font-weight="600" text-anchor="middle">opaque floor</text><circle cx="220" cy="360" r="14" fill="#e8edf7"/><circle cx="224" cy="360" r="6" fill="#0a0e16"/><text x="220" y="334" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="17" fill="#e8edf7" font-weight="600" text-anchor="middle">eye</text><line x1="220" y1="360" x2="560" y2="640" stroke="#e8edf7" stroke-width="2.5" stroke-linecap="round"/><line x1="560" y1="640" x2="620" y2="689" stroke="#e8edf7" stroke-width="2.5" stroke-dasharray="6 5" stroke-linecap="round"/><circle cx="620" cy="689" r="6" fill="#e8edf7"/><line x1="560" y1="640" x2="620" y2="591" stroke="#f2b94b" stroke-width="2" stroke-dasharray="2 6" stroke-linecap="round"/><text x="256" y="340" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="17" fill="#e8edf7">the eye looks through the floor</text><text x="256" y="364" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="17" fill="#e8edf7">and sees the mirrored car</text><rect x="1188" y="252" width="636" height="738" rx="18" fill="#111827" stroke="#243049" stroke-width="1.5" filter="url(#shadow)"/><circle cx="1240" cy="322" r="22" fill="#38b2d8" fill-opacity="0.18" stroke="#38b2d8" stroke-width="2"/><text x="1240" y="330" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="22" fill="#38b2d8" font-weight="700" text-anchor="middle">1</text><text x="1280" y="331" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="25" fill="#38b2d8" font-weight="700">Mirror the scene</text><text x="1280" y="372" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="19" fill="#e8edf7">world, cars and objects above a</text><text x="1280" y="402" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="19" fill="#e8edf7">.rim plane, flipped below the floor</text><circle cx="1240" cy="490" r="22" fill="#f2b94b" fill-opacity="0.18" stroke="#f2b94b" stroke-width="2"/><text x="1240" y="498" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="22" fill="#f2b94b" font-weight="700" text-anchor="middle">2</text><text x="1280" y="499" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="25" fill="#f2b94b" font-weight="700">Draw the copy first</text><text x="1280" y="540" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="19" fill="#e8edf7">as if the room went on downward</text><text x="1280" y="570" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="19" fill="#e8edf7">up to the mirror distance</text><circle cx="1240" cy="658" r="22" fill="#7c8cff" fill-opacity="0.18" stroke="#7c8cff" stroke-width="2"/><text x="1240" y="666" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="22" fill="#7c8cff" font-weight="700" text-anchor="middle">3</text><text x="1280" y="667" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="25" fill="#7c8cff" font-weight="700">Draw the floor on top</text><text x="1280" y="708" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="19" fill="#e8edf7">MIRROR polygons translucent</text><text x="1280" y="738" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="19" fill="#e8edf7">with the mix from the .inf (0.6)</text><circle cx="1240" cy="826" r="22" fill="#8d97ad" fill-opacity="0.18" stroke="#8d97ad" stroke-width="2"/><text x="1240" y="834" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="22" fill="#8d97ad" font-weight="700" text-anchor="middle">4</text><text x="1280" y="835" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="25" fill="#8d97ad" font-weight="700">The rest hides it</text><text x="1280" y="876" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="19" fill="#e8edf7">opaque floor and walls cover the</text><text x="1280" y="906" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="19" fill="#e8edf7">copy through the z-buffer</text><text x="1220" y="960" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="16" fill="#4b5672">No render to texture in 1999 · probably, not checked against code</text>
<text x="96" y="1040" style="white-space:pre" font-family="'Segoe UI', Arial, sans-serif" font-size="16" fill="#4b5672" font-weight="700" letter-spacing="4">RE-VOLT  →  RUSTL</text>
